[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "humanlint"
version = "0.2.0"
description = "Agent-native repository audit CLI and standard."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "humanlint Project" }
]
dependencies = []

[project.scripts]
humanlint = "humanlint.cli:main"

[tool.setuptools.packages.find]
include = ["humanlint*"]
