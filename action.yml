name: "Jankurai"
description: "Anti-vibe coding standard and local audit CLI for auditable AI-assisted merge"
branding:
  icon: "check-circle"
  color: "green"

inputs:
  mode:
    description: "Audit mode: observe, advisory, ratchet"
    required: false
    default: "advisory"
  baseline:
    description: "Path to baseline score JSON (required for ratchet mode)"
    required: false
    default: "agent/repo-score.json"

runs:
  using: "composite"
  steps:
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install local jankurai
      shell: bash
      run: cargo install --path "$GITHUB_ACTION_PATH/crates/jankurai" --locked --force

    - name: Prepare jankurai artifact directories
      shell: bash
      run: mkdir -p target/jankurai

    - name: Run jankurai audit
      shell: bash
      run: |
        if [ "${{ inputs.mode }}" = "ratchet" ]; then
          jankurai audit . --mode ratchet --baseline "${{ inputs.baseline }}" --json agent/repo-score.json --md agent/repo-score.md --sarif target/jankurai/jankurai.sarif --github-step-summary target/jankurai/summary.md --repair-queue-jsonl target/jankurai/repair-queue.jsonl
        else
          jankurai audit . --mode "${{ inputs.mode }}" --json agent/repo-score.json --md agent/repo-score.md --sarif target/jankurai/jankurai.sarif --github-step-summary target/jankurai/summary.md --repair-queue-jsonl target/jankurai/repair-queue.jsonl
        fi

    - name: Publish jankurai summary
      shell: bash
      if: always()
      run: |
        if [ -f target/jankurai/summary.md ]; then
          cat target/jankurai/summary.md >> "$GITHUB_STEP_SUMMARY"
        fi
