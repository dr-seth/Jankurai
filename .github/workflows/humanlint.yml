name: humanlint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check audit versions
        run: cargo run -p humanlint -- versions
      - name: humanlint audit
        run: cargo run -p humanlint -- audit . --mode ratchet --json agent/repo-score.json --md agent/repo-score.md --sarif target/humanlint/humanlint.sarif --github-step-summary target/humanlint/summary.md --repair-queue-jsonl target/humanlint/repair-queue.jsonl
      - name: Publish humanlint summary
        run: cat target/humanlint/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Security lane
        run: bash tools/security-lane.sh
      - uses: actions/upload-artifact@v4
        with:
          name: humanlint-score
          path: |
            agent/repo-score.json
            agent/repo-score.md
            target/humanlint/humanlint.sarif
            target/humanlint/repair-queue.jsonl

  ux-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm --workspace @humanlint/ux-qa run build
      - run: npm --workspace @humanlint/ux-qa run test

  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build paper
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error -outdir=paper paper/humanlint.tex
