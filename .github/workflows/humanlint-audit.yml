name: humanlint-audit

on:
  pull_request:
  push:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: humanlint audit
        run: python3 tools/humanlint.py . --json repo-score.json --md repo-score.md
      - name: Security lane placeholders
        run: |
          echo "gitleaks detect --source ."
          echo "syft . -o spdx-json"
          echo "grype ."
          echo "zizmor .github/workflows"
      - uses: actions/upload-artifact@v4
        with:
          name: humanlint-score
          path: |
            repo-score.json
            repo-score.md

  ux-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm --workspace @humanlint/ux-qa run build
      - run: npm --workspace @humanlint/ux-qa run test

  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build paper
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error -outdir=paper paper/humanlint.tex
