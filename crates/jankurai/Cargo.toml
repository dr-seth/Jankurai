[package]
name = "jankurai"
version = "0.4.0"
edition = "2021"
description = "Agent-native repository audit CLI and standard."
license = "MIT"

[dependencies]
anyhow = "1.0"
aho-corasick = "1.1"
clap = { version = "4.5", features = ["derive"] }
ignore = "0.4"
once_cell = "1.21"
rayon = "1.11"
regex = "1.12"
serde_yaml = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "0.9"

[dev-dependencies]
tempfile = "3.23"
