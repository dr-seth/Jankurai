[package]
name = "humanlint"
version = "0.2.0"
edition = "2021"
description = "Agent-native repository audit CLI and standard."
license = "MIT"

[dependencies]
anyhow = "1.0"
aho-corasick = "1.1"
clap = { version = "4.5", features = ["derive"] }
ignore = "0.4"
once_cell = "1.21"
rayon = "1.11"
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"

[dev-dependencies]
tempfile = "3.23"
